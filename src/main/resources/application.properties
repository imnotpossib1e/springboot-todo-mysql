# 로깅 및 관리 도구에서 애플리케이션을 식별할 수 있도록 애플리케이션 이름 설정
spring.application.name=todo-mysql

# 스프링 부트 애플리케이션이 MySQL 데이터베이스에 접근할 수 있도록 데이터베이스 URL 설정
spring.datasource.url=jdbc:mysql://localhost:3306/todo_db

# 데이터베이스에 접근할 사용자 이름(todo_user) 설정
spring.datasource.username=todo_user

#데이터베이스 사용자(todo_user)를 위한 비밀번호 설정
spring.datasource.password=1526

# JDBC 드라이버를 사용해 MySQL 데이터베이스에 접근하도록 설정
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate가 데이터베이스 스키마(테이블 및 컬럼 구조)를 자동으로 업데이트하도록 설정
spring.jpa.hibernate.ddl-auto=update

# SQL 쿼리를 출력하도록 설정
spring.jpa.show-sql=true

